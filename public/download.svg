<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skillSphereGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"></stop>
      <stop offset="100%" stop-color="#9333EA"></stop>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"></feDropShadow>
    </filter>
  </defs>

  <!-- Rounded Square Background -->
  <rect x="10" y="10" width="100" height="100" rx="22" fill="url(#skillSphereGradient)" filter="url(#shadow)"></rect>

  <!-- Letter S -->
  <text x="60" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="900" fill="white">
    S
  </text>
</svg>